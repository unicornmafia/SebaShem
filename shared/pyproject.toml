[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sebashem-text"
version = "0.1.0"
description = "Manuel de Codage / transliteration text handling shared by the SebaShem trainer and API"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
include = ["sebashem_text*"]
